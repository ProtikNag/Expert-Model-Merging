# MergeBench Tier 0 / Tier 1 fail-fast validation.
#
# Start small: Gemma-2-2B is the smallest MergeBench base. Begin Tier 0/1 on
# two of the most disjoint domains (math, coding), then widen only if the
# go/no-go gates pass. Expert repos follow MergeBench's naming convention:
#   MergeBench/<base_name>_<domain>   e.g. MergeBench/gemma-2-2b_math
# Confirm exact repo names at https://huggingface.co/MergeBench and accept the
# base model license on HuggingFace before downloading.

seed: 42

base_model: google/gemma-2-2b        # smallest MergeBench base
base_name: gemma-2-2b                # = base_model.split('/')[-1]

# All five MergeBench domains. tier_domains selects the subset to run now.
domains: [instruction, math, coding, safety, multilingual]
tier_domains: [math, coding]         # fail-fast start (N=2)

# Where downloaded checkpoints live locally (one subdir per repo).
download_dir: ./mb_ckpts

# Local clone of the MergeBench repo (https://github.com/uiuctml/MergeBench).
# Its baseline merger classes are driven directly for a confound-free compare.
mergebench_dir: ./MergeBench

# Our methods (run via the tested standalone path in mergebench/llm_merge.py).
# whc_diag is the diagonal dataless WHC; task_arith here is a harness
# cross-check against MergeBench's TaskArithmetic.
our_methods:
  task_arith: {scale: 0.4}
  whc_diag: {lam: 1.0e-4, curvature: taskvec}

# MergeBench baseline classes, run via mergebench/mb_baselines.py.
# Dataless tier needs weights only; data tier needs MergeBench's data env + GPU.
baselines_dataless:
  TaskArithmetic: {scaling_coef: 0.4}
  TIES: {scaling_coef: 0.4, K: 0.3, merge_func: sum}
  DARE: {scaling_coef: 0.4, p: 0.9}
  Consensus: {scaling_coef: 0.4, k: 2, lamda: 0.5}
  LocalizeAndStitch: {sparsity: 0.1, dataless: true, sigmoid_bias: 3}

baselines_data:           # phase 2: needs MergeBench data env + GPU
  RegMean: {reduction: 0.5}
  RegMeanPlusPlus: {reduction: 0.1}

paths:
  merged: ./mb_merged           # merged checkpoints (one subdir per method)
  results: ./results/mergebench # divergence json, merge summaries
  logs: ./results/logs          # RunLogger tees + manifests + metrics jsonl
